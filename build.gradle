plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        name = "JEI"
        url 'https://maven.blamejared.com'
    }
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users starting in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Subsystems ported in their own dedicated sessions; excluded from the initial core port.
// Re-enable each block as that subsystem is brought up to 26.1.
sourceSets.main.java {
    // Datagen for compat mods without a 26.1.2 build (mekanism, thermal, treetap, botany pots) stays excluded.
    exclude 'cy/jdkdigital/productivetrees/datagen/compat/CompatRecipeProvider.java'
    exclude 'cy/jdkdigital/productivetrees/datagen/recipe/ThermalExtractorRecipeBuilder.java'
    exclude 'cy/jdkdigital/productivetrees/datagen/recipe/ThermalInsulatorRecipeBuilder.java'
    exclude 'cy/jdkdigital/productivetrees/datagen/recipe/ThermalSawmilRecipeBuilder.java'
    exclude 'cy/jdkdigital/productivetrees/datagen/recipe/BotanyPotBlockDerivedCropRecipeBuilder.java'
    exclude 'cy/jdkdigital/productivetrees/datagen/recipe/TreetapRecipeBuilder.java'
    exclude 'cy/jdkdigital/productivetrees/integrations/au/**'
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "local.libs:productivelib-${lib_version}"
    implementation "local.libs:productivebees-${pb_version}"

    jarJar(group: 'cy.jdkdigital.productivelib', name: 'productivelib', version: "${lib_version_range}") {
        transitive(false)
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // In-dev testing only — present at runtime, not shipped or pulled by dependents.
    localRuntime "curse.maven:jade-324717:7938398"
    localRuntime "curse.maven:utilitarian-929559:8216931"  // utilitarian-26.1.2-0.22.0

    // Mod-compat dependencies — file IDs resolved against MC 26.1.2 on CurseForge.
    // AgriTech (mod id "agritechtwo") and its companion AgriTech: Evolved (mod id "agritechevolved").
    implementation "curse.maven:agritech-1485550:8261458"  // agritechtwo-1.2.2.1+neoforge-mc-26.1.2
    implementation "curse.maven:agritech-evolved-1287394:8261464"  // agritechevolved-2.1.2.1+neoforge-mc26.1.2

    // Re-enable each as the upstream mod publishes a 26.1.2 build and its integration is ported.
//    implementation "curse.maven:treetap-927874:6026105"  // no 26.1.2
//    implementation "curse.maven:almost-unified-633823:6014834"  // no 26.1.2
//    implementation "curse.maven:mekanism-268560:5574951"  // no 26.1.2
//    implementation "curse.maven:botany-pots-353928:6895762"  // no 26.1.2
//    implementation "curse.maven:botany-trees-411357:6895799"  // no 26.1.2
//    implementation "curse.maven:prickle-1023259:6546240"  // no 26.1.2
//    implementation "curse.maven:bookshelf-228525:6717571"  // no 26.1.2
//    implementation "curse.maven:patchouli-306770:6842247"  // no 26.1.2

    // FTB Ultimine (+ required deps) for in-dev testing only — vein-mine trunks to test leaf decay etc.
//    localRuntime "curse.maven:architectury-api-419699:5786327"  // no 26.1.2
//    localRuntime "curse.maven:ftb-library-404465:7746959"  // no 26.1.2
//    localRuntime "curse.maven:ftb-ultimine-386134:8078515"  // no 26.1.2
//    localRuntime "curse.maven:fast-leaf-decay-230976:5849090"  // no 26.1.2
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            lib_version            : lib_version,
            lib_version_range      : lib_version_range,
            pb_version             : pb_version,
            pb_version_range       : pb_version_range,
            jei_version            : jei_version,
            treetap_version        : treetap_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
